<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>术语库 | Beilai</title>
    <meta
      name="description"
      content="Beilai 术语库单页站点，打开网页即可查看全部标准术语。"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <main class="site-shell">
      <section class="hero">
        <div class="hero-top">
          <div class="brand-mark">
            <img src="assets/logo.png" alt="Beilai logo" />
          </div>
          <div>
            <p class="eyebrow">Beilai Documentation</p>
            <h1>术语库</h1>
          </div>
        </div>
        <p>
          这是通用术语库，提供专业术语英文翻译。
        </p>
        <div class="hero-tools">
          <article class="stat-card stat-card-wide">
            <div>
              <span class="stat-label">术语数量</span>
              <span class="stat-value" id="totalTerms">--</span>
            </div>
            <label class="search-box search-box-hero" aria-label="搜索术语">
              <span>搜索</span>
              <input
                id="searchInput"
                type="search"
                placeholder="输入中文、英文或备注，例如 Wi-Fi / 蜂鸣器 / Beilai"
              />
            </label>
          </article>
        </div>
      </section>

      <section class="content-grid content-grid-wide">
        <section class="table-wrap">
          <div class="table-head">
            <h2>标准术语表</h2>
            <div class="table-meta" id="resultCount">共 -- 条术语</div>
          </div>

          <table>
            <thead>
              <tr>
                <th scope="col">中文术语</th>
                <th scope="col">标准英文</th>
                <th scope="col">备注</th>
              </tr>
            </thead>
            <tbody id="termTable"></tbody>
          </table>

          <div class="empty-state" id="emptyState">
            没有匹配的术语，请换个关键词试试。
          </div>
        </section>
      </section>

      <p class="footer">本页为静态单页站点，双击打开即可使用。</p>
    </main>

    <script src="terms.js"></script>
    <script>
      const input = document.getElementById("searchInput");
      const termTable = document.getElementById("termTable");
      const totalTerms = document.getElementById("totalTerms");
      const resultCount = document.getElementById("resultCount");
      const emptyState = document.getElementById("emptyState");
      let rows = [];

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => {
          const map = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          };
          return map[char];
        });
      }

      function renderRows(terms) {
        termTable.innerHTML = terms
          .map(
            (term) => `
              <tr>
                <td class="term-cn">${escapeHtml(term.cn)}</td>
                <td class="term-en">${escapeHtml(term.en)}</td>
                <td class="note">${escapeHtml(term.note)}</td>
              </tr>
            `
          )
          .join("");

        rows = Array.from(termTable.querySelectorAll("tr"));
        totalTerms.textContent = `${rows.length} 条`;
        updateFilter();
      }

      function updateFilter() {
        const keyword = input.value.trim().toLowerCase();
        let visible = 0;

        rows.forEach((row) => {
          const text = row.innerText.toLowerCase();
          const matched = !keyword || text.includes(keyword);
          row.hidden = !matched;
          if (matched) {
            visible += 1;
          }
        });

        resultCount.textContent = `共 ${visible} 条术语`;
        emptyState.style.display = visible === 0 ? "block" : "none";
      }

      function loadTerms() {
        if (!Array.isArray(window.TERMS)) {
          termTable.innerHTML = `
            <tr>
              <td colspan="3" class="note">术语数据加载失败，请确认 \`terms.js\` 是否存在且格式正确。</td>
            </tr>
          `;
          totalTerms.textContent = "--";
          resultCount.textContent = "加载失败";
          emptyState.style.display = "none";
          return;
        }

        renderRows(window.TERMS);
      }

      input.addEventListener("input", updateFilter);
      loadTerms();
    </script>
  </body>
</html>
